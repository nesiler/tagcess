# Local test stack for tagcess: a real Headscale v0.29.4 (the pinned production version,
# .agents/skills/stack-notes/reference.md) plus a socat relay for its gRPC socket.
#
# Zitadel is NOT part of this stack. It runs only in the developer's k3s lab (ADR 0014, namespace tagcess-lab,
# tagcess-zitadel.lab.example.com) and is Headscale's OIDC issuer. `make lab-up` / `make lab-down` (test/lab)
# drive this file; the seed tool (test/compose/seed) runs after the lab Zitadel is healthy and before
# Headscale starts, because Headscale's OIDC client secret is generated by the seed tool.
#
# `headscale` runs with `network_mode: host` so its listeners (127.0.0.1 only, see headscale/config.yaml)
# and the seed/test tooling share the developer's loopback.
services:
  headscale:
    image: headscale/headscale:0.29.4
    network_mode: host
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
      # F2-006 (ADR 0013): the extra-records file Headscale watches. A directory
      # mount (never a single file) keeps the atomic rename legal. Seeded by
      # test/lab/up.sh before the first `compose up`; gitignored.
      - ./dns:/var/lib/tagcess-dns
    command: ["serve"]
    environment:
      HEADSCALE_OIDC_ISSUER: ${HEADSCALE_OIDC_ISSUER:-https://tagcess-zitadel.lab.example.com}
      HEADSCALE_OIDC_CLIENT_ID: ${HEADSCALE_OIDC_CLIENT_ID:-}
      HEADSCALE_OIDC_CLIENT_SECRET: ${HEADSCALE_OIDC_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # F1-006: OrbStack does not proxy unix sockets through bind mounts (connect() from the macOS host
  # is refused), so the Go tests reach Headscale's gRPC unix socket through this relay on
  # 127.0.0.1:50444. It shares the socket's named volume. Test stack only; production tagcess dials
  # the socket directly.
  headscale-relay:
    image: alpine/socat:1.8.0.3
    depends_on:
      - headscale
    volumes:
      - headscale-run:/run/hs
    ports:
      - "127.0.0.1:50444:50444"
    command: ["TCP-LISTEN:50444,fork,reuseaddr", "UNIX-CONNECT:/run/hs/headscale.sock"]

  # F1-020: the production-like auth path (Caddy -> oauth2-proxy -> upstream) so the browser login
  # flow can be exercised against the lab Zitadel. Caddy's test Caddyfile mirrors the F1-019 prod
  # snippet (test/compose/caddy/Caddyfile). The OIDC app and the client id/secret/cookie secret are
  # created by the seed and land in test/compose/.env (gitignored).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    environment:
      # The same lab issuer as Headscale (test/lab/up.sh exports it from lib.sh LAB_HOST); overrides the cfg file.
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${HEADSCALE_OIDC_ISSUER:-https://tagcess-zitadel.lab.example.com}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    ports:
      - "127.0.0.1:4180:4180"
    # No container healthcheck: the image is distroless (no shell/wget). TestCompose_LoginFlow checks
    # its /ping endpoint instead.

  caddy:
    image: caddy:2.8.4
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
      # F2-008: the admin endpoint for the apply integration tests. The
      # Caddyfile moves its admin listener to 0.0.0.0 (inside the container
      # only); the publish keeps it on the host loopback. Production keeps the
      # default localhost:2019 with no publish at all.
      - "127.0.0.1:2019:2019"
    depends_on:
      - oauth2-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  headscale-data:
  headscale-run:
