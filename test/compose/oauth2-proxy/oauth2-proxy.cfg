# F1-020 local test oauth2-proxy (v7.15.4, the production version). It authenticates the browser
# against the lab Zitadel (ADR 0014) and answers Caddy's forward_auth. client_id, client_secret and
# cookie_secret are NOT here: the seed writes them to test/compose/.env, compose passes them as
# OAUTH2_PROXY_* environment variables, and oauth2-proxy merges env over this file.
provider = "oidc"
oidc_issuer_url = "https://tagcess-zitadel.lab.example.com"
# The `groups` claim the F1-026 Action fills (production uses the same name, stack-notes).
oidc_groups_claim = "groups"
redirect_url = "http://localhost:8080/oauth2/callback"
# static://200 makes oauth2-proxy itself the "upstream"; Caddy proxies to it after forward_auth
# instead of a tagcess ui.sock (the test stack has no tagcess UI, that is F1-021).
upstreams = ["static://200"]
http_address = "0.0.0.0:4180"
set_xauthrequest = true
skip_provider_button = true
email_domains = ["*"]
cookie_name = "tagcess_test"
cookie_secure = false
cookie_samesite = "lax"
# Caddy runs forward_auth before the proxy, so oauth2-proxy only checks the session and proxies.
reverse_proxy = true
