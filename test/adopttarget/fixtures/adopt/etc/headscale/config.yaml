# Adopt-shaped Headscale 0.29.4 config for the F6 adopt test target (example.test names).
# The OIDC client secret is a random placeholder generated when the image is built; the issuer does not
# exist, so only_start_if_oidc_is_available: false (as in an existing installation) keeps Headscale running.
server_url: https://hs.c.example.test
listen_addr: 127.0.0.1:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
trusted_proxies:
  - 127.0.0.1/32
  - ::1/128

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 192.0.2.10
  urls: []
  paths: []
  auto_update_enabled: false

disable_check_updates: true

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  base_domain: ts.c.example.test
  override_local_dns: true
  nameservers:
    global:
      - 192.0.2.53
      - 198.51.100.53
  search_domains: []
  extra_records_path: /etc/headscale/extra-records.json

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

oidc:
  only_start_if_oidc_is_available: false
  issuer: "https://auth.c.example.test"
  client_id: "100000000000000001"
  client_secret_path: /etc/headscale/oidc_client_secret
  scope: ["openid", "profile", "email"]
  pkce:
    enabled: true
    method: S256

logtail:
  enabled: false

taildrop:
  enabled: true

log:
  level: info
  format: text
