# Adopt-shaped oauth2-proxy 7.15.4 config for the F6 adopt test target (example.test
# names). The client and cookie secrets are files generated when the image is built; never in this file.
provider = "oidc"
oidc_issuer_url = "https://auth.c.example.test"
client_id = "100000000000000002"
client_secret_file = "/etc/oauth2-proxy/client_secret"
cookie_secret_file = "/etc/oauth2-proxy/cookie_secret"
oidc_groups_claim = "groups"
scope = "openid profile email"
http_address = "127.0.0.1:4180"
upstreams = ["static://202"]
reverse_proxy = true
set_xauthrequest = true
skip_provider_button = true
email_domains = ["*"]
insecure_oidc_allow_unverified_email = true
trusted_proxy_ips = ["127.0.0.1/32", "::1/128"]
cookie_name = "_vpn_auth"
cookie_domains = [".c.example.test", ".b.example.test", ".a.example.test"]
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "12h"
cookie_refresh = "1h"
whitelist_domains = [".c.example.test", ".b.example.test", ".a.example.test"]
