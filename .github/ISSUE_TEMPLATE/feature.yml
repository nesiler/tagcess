name: Feature request
description: Suggest new behaviour for tagcess.
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do that tagcess does not support today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, ideally from the UI (tagcess avoids manual configuration steps).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: risk
    attributes:
      label: Does it touch access control?
      description: Authn/authz, webhooks, policy/ACL writes, generated config, node expiry or secrets.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
