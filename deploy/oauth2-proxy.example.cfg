# oauth2-proxy example for the tagcess gate (F5 I12). The operator owns this file; tagcess neither
# renders nor reads it. client_id, client_secret and cookie_secret come from the environment or a
# secret file, never from here.
provider = "oidc"
oidc_issuer_url = "https://auth.example.com"
oidc_groups_claim = "groups"
redirect_url = "https://tagcess.example.com/oauth2/callback"
upstreams = ["static://200"]
http_address = "127.0.0.1:4180"
set_xauthrequest = true
skip_provider_button = true
reverse_proxy = true

# ONE gate cookie for every site: cookie_domains is the parent domain of sites.allowed_domains
# (leading dot). A browser signed in on one site then passes on all of them.
cookie_name = "_tagcess_gate"
cookie_domains = [".example.com"]
cookie_secure = true
cookie_samesite = "lax"

# Short lifetime, no silent refresh. The cookie lifetime IS the role-revocation delay: a role
# removed in Zitadel stops working at the latest when this cookie expires. The Zitadel session
# makes the re-login seamless, so a short value costs the user nothing. Keep cookie_refresh off.
cookie_expire = "1h"
cookie_refresh = "0"

# Sign-out (J1): "/oauth2/sign_out?rd=<Zitadel end_session URL>" redirects to the Zitadel host, so that host
# must be whitelisted for rd redirects. Use the host of zitadel.issuer in tagcess's config.
whitelist_domains = ["auth.example.com"]
