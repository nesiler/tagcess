# systemd drop-in for headscale.service (K1). Install on the Headscale host:
#   install -D -m 0644 headscale-preserve.conf /etc/systemd/system/headscale.service.d/preserve.conf
#   systemctl daemon-reload && systemctl restart headscale
#
# The stock unit has RuntimeDirectory=headscale, so systemd deletes and recreates /var/run/headscale
# (a new inode) on every restart. The tagcess container bind-mounts that directory and would then see
# an empty one ("connect: no such file or directory"). Preserve keeps the directory, and with it the
# bind mount, across restarts.
[Service]
RuntimeDirectoryPreserve=yes
