# Headscale 0.29.4 config written by the tagcess installer (headscale_install, F6-012).
# tagcess manages it afterwards through the ADR 0008 candidate flow; the installer rewrites it only while it owns Headscale.
server_url: https://hs.lab.example.com
listen_addr: 127.0.0.1:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
trusted_proxies:
  - 127.0.0.1/32
  - ::1/128

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 203.0.113.10
  urls: []
  paths: []
  auto_update_enabled: false

disable_check_updates: true

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  base_domain: ts.lab.example.com
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 9.9.9.9
  search_domains: []
  extra_records_path: /var/lib/tagcess/dns/extra-records.json

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

oidc:
  only_start_if_oidc_is_available: false
  issuer: "https://auth.lab.example.com"
  client_id: "339000000000000003"
  client_secret_path: /etc/headscale/oidc_client_secret
  scope: ["openid", "profile", "email"]
  pkce:
    enabled: true
    method: S256

logtail:
  enabled: false

taildrop:
  enabled: true

log:
  level: info
  format: text
