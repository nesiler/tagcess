# Test helper (F6-006): oauth2-proxy.cfg rendered on the controller.
- name: Oauth2-proxy render
  hosts: vpn
  gather_facts: false
  roles:
    - role: config
      tags: [always]
  tasks:
    - name: Render
      ansible.builtin.import_role:
        name: oauth2_proxy
        tasks_from: render_only.yml
