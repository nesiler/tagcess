# Generated by the tagcess installer (app phase). Change the installer settings and rerun the phase instead of
# editing this file: the next run would replace it.
data_dir: /var/lib/tagcess
k8s_auth_dir: /var/lib/tagcess-credentials
ui:
  socket: /run/tagcess/ui.sock
  socket_group: caddy
  socket_mode: "0660"
hook:
  listen: 100.64.0.1:9443
  signing_key_file: /etc/tagcess/secrets/webhook-signing-key
  groups_signing_key_file: /etc/tagcess/secrets/groups-signing-key
headscale:
  socket: /var/run/headscale/headscale.sock
hostapply:
  requests_dir: /var/lib/tagcess-headscale/requests
  results_dir: /var/lib/tagcess-headscale/results
zitadel:
  issuer: https://auth.lab.example.com
  project_id: "339000000000000001"
  key_file: /etc/tagcess/secrets/zitadel-key.json
  oauth2_proxy_app: oauth2-proxy
caddy:
  admin_url: http://127.0.0.1:2019
  caddyfile_path: /etc/caddy/Caddyfile
dns:
  records_path: /var/lib/tagcess/dns/extra-records.json
sync:
  interval: 5m
sites:
  allowed_domains: ["lab.example.com"]
  allowed_targets: ["100.64.0.5"]
  zitadel_internal_sources: ["10.0.0.0/16", "127.0.0.1/32", "::1/128"]
  acme_email: admin@lab.example.com
  certificates: ["lab.example.com"]
  vpn_address: 100.64.0.1
  k8s_upstream: https://100.64.0.5
  tagcess_host: tagcess.lab.example.com
  seed_file: /var/lib/tagcess/seed-sites.json
gate:
  client_id: "339000000000000002"
