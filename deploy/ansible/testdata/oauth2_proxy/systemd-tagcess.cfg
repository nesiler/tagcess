# Generated by the tagcess installer (oauth2_proxy phase). The client and cookie secrets are files next to this
# one, never values here. Group checks are not configured here: Caddy forward_auth asks /oauth2/auth?allowed_groups=
# (architecture §8.1).
provider = "oidc"
oidc_issuer_url = "https://auth.c.example.test"
client_id = "100000000000000002"
client_secret_file = "/etc/oauth2-proxy/client_secret"
cookie_secret_file = "/etc/oauth2-proxy/cookie_secret"
oidc_groups_claim = "groups"
scope = "openid profile email"
http_address = "127.0.0.1:4180"
upstreams = ["static://202"]
reverse_proxy = true
set_xauthrequest = true
skip_provider_button = true
email_domains = ["*"]
insecure_oidc_allow_unverified_email = true
trusted_proxy_ips = ["127.0.0.1/32", "::1/128"]
# One shared gate cookie for every site, short lifetime, no silent refresh (decision 3 [K]; F5 I12).
cookie_name = "_tagcess_gate"
cookie_domains = [".internal.a.example.test", ".b.example.test", ".c.example.test"]
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "1h"
cookie_refresh = "0"
whitelist_domains = ["auth.c.example.test", ".internal.a.example.test", ".b.example.test", ".c.example.test"]
