# After a phase changed Headscale's policy file or restarted Headscale: restart the tagcess container, so it sees the
# new policy file (the compose file bind-mounts that one file, and the phase replaces it with a new inode) and opens a
# fresh connection to Headscale. tagcess is not in the request path of any site (Caddy serves them), so the restart
# only pauses the UI and the hook for a few seconds. No container (tagcess not installed yet): nothing to do.
- name: tagcess container present?
  ansible.builtin.command: docker inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' tagcess
  register: hs_refresh_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Restart tagcess and wait until it started again
  when: hs_refresh_state.rc == 0 and not ansible_check_mode
  block:
    - name: Started count before the restart  # noqa: risky-shell-pipe (grep -c exits 1 on zero)
      ansible.builtin.shell: "docker logs tagcess 2>&1 | grep -c 'tagcess started' || true"
      register: hs_refresh_before
      changed_when: false

    - name: Restart tagcess
      ansible.builtin.command: docker restart tagcess
      changed_when: true

    - name: tagcess started again  # noqa: risky-shell-pipe
      ansible.builtin.shell: "docker logs tagcess 2>&1 | grep -c 'tagcess started' || true"
      register: hs_refresh_after
      changed_when: false
      until: hs_refresh_after.stdout | int > hs_refresh_before.stdout | int
      retries: "{{ app_start_timeout | default(60) }}"
      delay: 1
