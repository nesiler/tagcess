# g02 (F6-007; docs/policy-database-migration.md; F1-005, F5 I8): file -> database policy mode without an empty-policy
# window: the policy is written into the database with the server stopped (bypass, --force, the same headscale binary)
# BEFORE the mode flips; a read-back that differs aborts back to file mode. Needs confirm_g02=yes and
# expected_policy_sha256 equal to the policy file at run time (preflight shows it); otherwise Headscale is not even
# stopped. Rollback: rollback.yml --tags g02.
- name: G-02 inputs
  ansible.builtin.set_fact:
    g02_mode: "{{ (preflight_hs_cfg | default({})).policy_mode | default('file') }}"
    g02_confirmed: "{{ (confirm_g02 | default('') | string) == 'yes' }}"

- name: Scratch names of this run (never a fixed name, so a file of someone else at the old name stays untouched)
  ansible.builtin.set_fact:
    g02_run: "{{ now(utc=true).strftime('%Y%m%dT%H%M%S') ~ '-' ~ '%04x' | format(65535 | random) }}"

- name: Candidate config and saved copy of this run
  ansible.builtin.set_fact:
    g02_cand: "{{ g02_candidate_config | regex_replace('[.]yaml$', '') }}-{{ g02_run }}.yaml"
    g02_prev: "{{ headscale_config }}.tagcess-prev-{{ g02_run }}"

- name: Already database (no change)
  ansible.builtin.debug:
    msg: "Headscale policy zaten database modunda; G-02 yapılmış, değişiklik yok."
  when: g02_mode == 'database'

- name: Waiting for confirmation (Headscale untouched)
  ansible.builtin.debug:
    msg: "g02 onay bekliyor: -e confirm_g02=yes -e expected_policy_sha256={{ preflight_policy_sha256 | default('') }}"
  when: g02_mode != 'database' and not g02_confirmed

- name: Switch to database mode
  when: g02_mode != 'database' and g02_confirmed
  block:
    - name: The policy file has not changed since it was reviewed
      ansible.builtin.command: "sha256sum {{ headscale_policy_path }}"
      register: g02_sha
      changed_when: false
      check_mode: false

    - name: Stop on a missing or different expected_policy_sha256 (Headscale not stopped, nothing changed)
      ansible.builtin.fail:
        msg: >-
          G-02 durdu: expected_policy_sha256 {{ expected_policy_sha256 | default('(verilmedi)') }}, policy dosyası şu an
          {{ g02_sha.stdout.split()[0] }}. Headscale durdurulmadı, hiçbir dosya değişmedi.
      when: (expected_policy_sha256 | default('') | string) != g02_sha.stdout.split()[0]

    - name: The policy passes headscale policy check (server running)
      ansible.builtin.command: "runuser -u headscale -- headscale -c {{ headscale_config }} policy check -f {{ headscale_policy_path }}"
      changed_when: false
      check_mode: false

    - name: Backup before writing (policy file, config, consistent database copy)
      ansible.builtin.include_role:
        name: backup
      vars:
        backup_phase: g02

    - name: The run in --check stops here
      ansible.builtin.debug:
        msg: "--check: G-02 planı: Headscale durur, policy DB'ye yazılır, geri okunur, mode: database, Headscale başlar."
      when: ansible_check_mode

    - name: Transition
      when: not ansible_check_mode
      block:
        - name: Candidate config (only policy.mode differs)
          ansible.builtin.shell: |
            set -e
            cp -p {{ headscale_config }} {{ g02_cand }}
            python3 - {{ g02_cand }} <<'PY'
            import re, sys
            p = sys.argv[1]
            lines = open(p).read().split("\n")
            out, in_policy, done = [], False, 0
            for line in lines:
                if re.match(r"^policy:\s*$", line):
                    in_policy = True
                elif in_policy and re.match(r"^\S", line):
                    in_policy = False
                if in_policy and re.match(r"^\s+mode:\s*file\s*$", line):
                    line = re.sub(r"file\s*$", "database", line)
                    done += 1
                out.append(line)
            if done != 1:
                sys.exit("policy.mode: file not found exactly once")
            open(p, "w").write("\n".join(out))
            PY
          changed_when: false

        - name: Today's config, kept with its mode and owner (for an abort)
          ansible.builtin.command: "cp -p {{ headscale_config }} {{ g02_prev }}"
          changed_when: false

        - name: Policy file content
          ansible.builtin.slurp:
            src: "{{ headscale_policy_path }}"
          register: g02_policy

        # The rescue restarts Headscale only after this point (a failure before the stop leaves it running).
        - name: Headscale is about to stop
          ansible.builtin.set_fact:
            g02_hs_stopped: true

        - name: Stop Headscale (clients keep their last ACL; nothing is opened)
          ansible.builtin.systemd_service:
            name: headscale
            state: stopped

        - name: Write the policy into the database (bypass, same binary, as the headscale user)
          ansible.builtin.command: >-
            runuser -u headscale -- headscale -c {{ g02_cand }} policy set
            --bypass-grpc-and-access-database-directly --force -f {{ headscale_policy_path }}
          changed_when: true

        - name: Read it back the same way
          ansible.builtin.command: >-
            runuser -u headscale -- headscale -c {{ g02_cand }} policy get
            --bypass-grpc-and-access-database-directly --force
          register: g02_readback
          changed_when: false

        - name: Installer state directory (scratch files)
          ansible.builtin.file:
            path: "{{ install_state_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          changed_when: false

        - name: Keep the read-back for the comparison
          ansible.builtin.copy:
            content: "{{ g02_readback.stdout }}{{ '\n{\"test\": \"corrupted read-back\"}' if g02_test_corrupt_readback | bool else '' }}"
            dest: "{{ install_state_dir }}/g02-readback.hujson"
            owner: root
            group: root
            mode: "0600"

        - name: Compare (same policy; Headscale blanks comments, so the meaning is compared)
          ansible.builtin.script:
            cmd: "hujson_acl.py --equal {{ headscale_policy_path }} {{ install_state_dir }}/g02-readback.hujson"
            executable: python3
          register: g02_compare
          changed_when: false
          failed_when: false

        - name: Equal?
          ansible.builtin.set_fact:
            g02_equal: "{{ g02_compare.rc == 0 }}"

        - name: Abort to file mode on a difference
          when: not g02_equal | bool
          block:
            - name: Remove the candidate config
              ansible.builtin.file:
                path: "{{ g02_cand }}"
                state: absent

            - name: Start Headscale in file mode
              ansible.builtin.systemd_service:
                name: headscale
                state: started

            - name: Headscale healthy again
              ansible.builtin.uri:
                url: "{{ headscale_health_url }}"
                status_code: 200
              register: g02_abort_health
              until: g02_abort_health.status == 200
              retries: 20
              delay: 1

            # Running again in file mode with the unchanged config: the rescue must not restart it a second time.
            - name: Headscale runs again (file mode)
              ansible.builtin.set_fact:
                g02_hs_stopped: false

            - name: Stop (file mode kept)
              ansible.builtin.fail:
                msg: "G-02 durduruldu: veritabanından geri okunan policy dosyayla aynı değil. Gerçek config değişmedi; Headscale file modunda yeniden başladı."

        - name: Switch the real config to database mode
          ansible.builtin.command: "mv {{ g02_cand }} {{ headscale_config }}"
          changed_when: true

        - name: Start Headscale in database mode
          ansible.builtin.systemd_service:
            name: headscale
            state: started

        - name: Headscale answers in database mode
          ansible.builtin.shell: "headscale policy get > {{ install_state_dir }}/g02-readback.hujson"
          register: g02_after
          until: g02_after.rc == 0
          retries: 20
          delay: 1
          changed_when: false

        - name: It serves the same policy
          ansible.builtin.script:
            cmd: "hujson_acl.py --equal {{ headscale_policy_path }} {{ install_state_dir }}/g02-readback.hujson"
            executable: python3
          changed_when: false

        - name: Remove the read-back copy
          ansible.builtin.file:
            path: "{{ install_state_dir }}/g02-readback.hujson"
            state: absent
          changed_when: false

      rescue:
        - name: Put the previous config back (mode and owner kept)
          ansible.builtin.shell: "test ! -e {{ g02_prev }} || cp -p {{ g02_prev }} {{ headscale_config }}"
          changed_when: true

        - name: Remove the candidate config and the saved copy (this run's names)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: ["{{ g02_cand }}", "{{ g02_prev }}"]

        - name: Headscale back in file mode
          ansible.builtin.systemd_service:
            name: headscale
            state: restarted
          when: g02_hs_stopped | default(false) | bool

        - name: Stop (file mode)
          ansible.builtin.fail:
            msg: >-
              G-02 tamamlanamadı; config file modunda{{ ', Headscale yeniden başlatıldı' if g02_hs_stopped | default(false) | bool
              else ', Headscale hiç durdurulmadı' }}. Ayrıntı yukarıdaki görevde.

    - name: Remove the saved copy
      ansible.builtin.file:
        path: "{{ g02_prev }}"
        state: absent
      changed_when: false
      when: not ansible_check_mode

    - name: Headplane can now write the policy
      ansible.builtin.debug:
        msg: "UYARI: policy artık database modunda. Headplane'in tam yetkili API key'i policy'yi yazabilir; tagcess dışında kimse yazmasın (F1-023 notu)."
      when: not ansible_check_mode

# Headscale was restarted in database mode: tagcess reconnects with a clean start.
- name: tagcess sees the change (container restart)
  ansible.builtin.include_tasks: refresh_tagcess.yml
  when: g02_mode != 'database' and g02_confirmed and not ansible_check_mode

- name: Guide items of g02
  ansible.builtin.set_fact:
    guide_items_g02: >-
      {{ [] if g02_mode == 'database' else ([{'id': 'g02-confirm', 'title': 'G-02 policy DB geçişi onay bekliyor',
          'steps': ['Policy dosyasının sha256\'sı: ' ~ (preflight_policy_sha256 | default('')) ~ ' (preflight). Dosya bundan sonra değişirse geçiş durur.',
                    'Onay: install.sh g02 fazında evet; -e confirm_g02=yes -e expected_policy_sha256=<yukarıdaki>.']}] if not g02_confirmed else
         [{'id': 'g02-headplane', 'title': 'G-02 sonrası: Headplane policy yazabilir',
           'steps': ['Policy database modunda. Headplane\'in API key\'i policy yazabilir; policy değişikliklerini yalnız tagcess arayüzünden yap.']}]) }}
