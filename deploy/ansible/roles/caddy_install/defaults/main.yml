# caddy_install (F6-012): fresh installs the pinned Caddy .deb [Ö] (sha256 checked, same pins as the adopt test
# target; the official apt repository would float the version) and writes the bootstrap Caddyfile: the seed's sites
# rendered by tagcess's own renderer (`tagcess -bootstrap-caddyfile`, so the first-import parity starts at 0) plus
# `import sites/*.caddy` (the existing installation layout; caddy_ui puts the UI block there). Candidate -> caddy validate -> in
# place -> start or reload. An existing Caddy is adopted untouched; once tagcess owns the Caddyfile (first import)
# the role writes nothing.
caddy_install_version: 2.8.4
caddy_deb_sha256:
  amd64: 8ea1c5dd7736307e4b4baab2a3ffe51f28f4e344536cbc32f3e4bf12e65d79cd
  arm64: 8ada2c4ef24feeb1eb899fd31a50e73e13813bc993d1149f4ab4bc07ceda5a90
caddy_deb_url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_install_version }}/caddy_{{ caddy_install_version }}_linux_{{ caddy_install_arch }}.deb"
caddy_download_dir: /var/cache/tagcess-install
caddy_bootstrap_sites_import: "sites/*.caddy"
caddy_bootstrap_tool: ""        # tagcess binary on the controller; empty: built from this repo into <env>/bin/tagcess
caddy_bootstrap_extra: ""       # text appended to the bootstrap (lab additions; the tests prove the validate gate with it)
