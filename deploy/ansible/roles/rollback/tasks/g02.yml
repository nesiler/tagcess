# g02 back (runbook "Geri dönüş"): today's database policy is written to the file first (it may be newer than the old
# file: review it), then mode: file and a restart; headscale policy check must pass.
- name: "Rollback g02: mode"
  ansible.builtin.command: "grep -Eq '^[[:space:]]+mode:[[:space:]]+database' {{ headscale_config }}"
  register: rollback_g02_db
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Rollback g02: already file mode"
  ansible.builtin.debug:
    msg: "Headscale policy zaten file modunda; g02 geri alınacak bir şey bırakmadı."
  when: rollback_g02_db.rc != 0

- name: "Rollback g02: saved copy of this run (never a fixed name)"
  ansible.builtin.set_fact:
    rollback_g02_prev: "{{ headscale_config }}.tagcess-prev-{{ now(utc=true).strftime('%Y%m%dT%H%M%S') }}-{{ '%04x' | format(65535 | random) }}"

- name: "Rollback g02: database -> file"
  when: rollback_g02_db.rc == 0 and not ansible_check_mode
  block:
    - name: "Rollback g02: backup first"
      ansible.builtin.include_role:
        name: backup
      vars:
        backup_phase: rollback-g02

    - name: "Rollback g02: today's database policy into the file (owner and mode kept)"
      ansible.builtin.shell: |
        set -e
        headscale policy get > {{ headscale_policy_path }}.from-db
        cp --attributes-only --preserve=mode,ownership {{ headscale_policy_path }} {{ headscale_policy_path }}.from-db
        mv {{ headscale_policy_path }}.from-db {{ headscale_policy_path }}
      changed_when: true

    - name: "Rollback g02: config mode file (owner and mode kept)"
      ansible.builtin.shell: |
        set -e
        cp -p {{ headscale_config }} {{ rollback_g02_prev }}
        sed -i -E 's/^([[:space:]]+mode:[[:space:]]+)database[[:space:]]*$/\1file/' {{ headscale_config }}
      changed_when: true

    - name: "Rollback g02: configtest"
      ansible.builtin.command: "runuser -u headscale -- headscale -c {{ headscale_config }} configtest"
      changed_when: false

    - name: "Rollback g02: restart in file mode"
      ansible.builtin.systemd_service:
        name: headscale
        state: restarted

    - name: "Rollback g02: healthy, and the file passes policy check"
      ansible.builtin.command: "runuser -u headscale -- headscale -c {{ headscale_config }} policy check -f {{ headscale_policy_path }}"
      register: rollback_g02_check
      until: rollback_g02_check.rc == 0
      retries: 20
      delay: 1
      changed_when: false

    - name: "Rollback g02: review the policy"
      ansible.builtin.debug:
        msg: "Policy file moduna döndü; dosya veritabanındaki güncel policy'dir. Gözden geçir: {{ headscale_policy_path }}"

  rescue:
    - name: "Rollback g02: put the database-mode config back"
      ansible.builtin.shell: "test ! -e {{ rollback_g02_prev }} || cp -p {{ rollback_g02_prev }} {{ headscale_config }}"
      changed_when: true

    - name: "Rollback g02: restart as it was"
      ansible.builtin.systemd_service:
        name: headscale
        state: restarted

    - name: "Rollback g02: stop"
      ansible.builtin.fail:
        msg: "g02 geri alınamadı (doğrulama düştü); database modu config'i geri kondu."

- name: "Rollback g02: remove the saved copy"
  ansible.builtin.file:
    path: "{{ rollback_g02_prev }}"
    state: absent
  changed_when: false
  when: not ansible_check_mode

- name: "Rollback g02: record"
  ansible.builtin.set_fact:
    install_state: >-
      {{ install_state | combine({'phases': install_state.phases | combine({'g02': install_state.phases.g02
           | combine({'rolled_back': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')})})}) }}
  when: rollback_g02_db.rc == 0 and install_state.phases.g02 is defined and not ansible_check_mode

- name: "Rollback g02: state file"
  ansible.builtin.copy:
    content: "{{ install_state | to_nice_json(indent=2) }}\n"
    dest: "{{ install_state_dir }}/state.json"
    owner: root
    group: root
    mode: "0600"
  changed_when: false
  when: rollback_g02_db.rc == 0 and install_state.phases.g02 is defined and not ansible_check_mode
