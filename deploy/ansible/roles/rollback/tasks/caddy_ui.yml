# caddy_ui: after the first import tagcess owns the Caddyfile: rolling this phase back alone is refused (use the
# UI's rollback, ADR 0017). A full rollback (all phases, confirm_remove_data=yes) returns Caddy to before the installer.
- name: "Rollback caddy_ui: does tagcess own the Caddyfile?"
  ansible.builtin.command: "head -1 {{ caddyfile_path }}"
  register: rollback_caddy_head
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Rollback caddy_ui: refused after the first import"
  ansible.builtin.fail:
    msg: >-
      İlk içe aktarma yapılmış: Caddyfile'ın sahibi tagcess. caddy_ui'yi tek başına geri almak Caddy dosyalarına yazmadan
      reddedildi; değişikliği arayüzden geri al (Siteler → geçmiş → geri dönüş, ADR 0017). Kurulum öncesine tam dönüş için
      rollback.yml'yi etiketsiz ve -e confirm_remove_data=yes ile koş.
  when: >-
    rollback_caddy_head.stdout is search('^# Generated by tagcess')
    and not ('all' in ansible_run_tags and (confirm_remove_data | default('') | string) == 'yes')

- name: "Rollback caddy_ui: files"
  ansible.builtin.import_tasks: generic_phase.yml
