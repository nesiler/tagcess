# What a backup takes (F6-003 [Ö]): everything the installer's phases may write (config, the Headscale OIDC secret
# file, certbot's credentials and /etc/letsencrypt, the Tailscale apt files, /etc/hosts when app_hosts_entries is set).
# Directories are copied whole.
# A path that does not exist is recorded as "existed: false" (fresh host) and never deleted on restore.
backup_paths_base:
  - "{{ caddy_dir }}"
  - /etc/caddy-secrets
  - /etc/systemd/system/caddy.service.d
  - "{{ headscale_config }}"
  - "{{ headscale_policy_path }}"
  - "{{ headscale_dns_records_path }}"
  - "{{ tagcess_dns_records_path }}"
  - "{{ headscale_oidc_secret_path | default('/etc/headscale/oidc_client_secret') }}"
  - "{{ certbot_credentials_dir | default('/root/.secrets/certbot') }}"
  - /etc/letsencrypt
  - /etc/apt/sources.list.d/tailscale.list
  - /usr/share/keyrings/tailscale-archive-keyring.gpg
  - /etc/systemd/system/headscale.service.d
  - "{{ oauth2_proxy_dir }}"
  - /etc/systemd/system/oauth2-proxy.service.d
  - /etc/tagcess
  - /etc/tmpfiles.d/tagcess.conf
  - /usr/local/bin/tagcess-hshelper
  - /etc/systemd/system/tagcess-hshelper.path
  - /etc/systemd/system/tagcess-hshelper.service
  - /etc/systemd/system/tagcess-hshelper-boot.service
# /etc/hosts is the app role's only when it has entries to add (a lab setting); otherwise it is not ours to back up.
backup_paths: "{{ backup_paths_base + (['/etc/hosts'] if (app_hosts_entries | default([])) | length > 0 else []) }}"
# Recorded, not copied (data directories; a rollback moves them aside only if they did not exist before).
backup_probe_paths:
  - /var/lib/tagcess
  - /var/lib/tagcess-credentials
  - /var/lib/tagcess-headscale
  - /run/tagcess
backup_sqlite:
  - {path: "{{ headscale_db_path }}", name: headscale-db.sqlite}
  - {path: /var/lib/tagcess/tagcess.db, name: tagcess.db}
backup_phase: "{{ phase_name | default('backup') }}"
