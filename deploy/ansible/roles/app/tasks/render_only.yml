# Test/plan helper (F6-005 golden tests): renders config.yaml and compose.yaml into app_render_dir on the controller.
- name: Render config.yaml (controller)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ app_render_dir }}/config.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Render compose.yaml (controller)
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ app_render_dir }}/compose.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
