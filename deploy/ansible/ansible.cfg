# tagcess installer (F6). install.sh and the tests point ANSIBLE_CONFIG at this file.
[defaults]
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
nocows = 1
# Secrets never reach the output: every task that touches one is no_log (F6 öneri 4).
display_args_to_stdout = False

[ssh_connection]
pipelining = True
