      vars:
        guide_phase: headscale_install
        guide_items: "{{ guide_items_headscale_install | default([]) }}"
      tags: [headscale_install]
      when: install_mode in tagcess_phase_modes['headscale_install']
    - name: "Phase headscale_install: state"
      ansible.builtin.import_role:
        name: state
        tasks_from: record
      vars:
        state_phase: headscale_install
      tags: [headscale_install]
      when: install_mode in tagcess_phase_modes['headscale_install']
    - name: "Phase caddy_install"
