# tagcess installer: every phase of the selected install_mode, in the order of group_vars/all/phases.yml
# (F6 öneri 8 [Ö]; TestSiteYml_PhaseOrderMatchesPhasesYml keeps the two equal). Each phase is a tag, so
# install.sh runs one phase per call (--tags <phase>). config, the host state and preflight run on every call
# (tags: always): a missing setting, a preflight blocker or a mode conflict stops the run before any phase
# writes (F6-002). Every phase ends with its guide file (F6-001) and, for a writing phase, a host state
# record with the backup id it took first (F6-008). The whole playbook supports --check --diff.
- name: Tagcess installer
  hosts: vpn
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Settings
      ansible.builtin.import_role:
        name: config
      tags: [always]
    - name: Installer state on the host
      ansible.builtin.import_role:
        name: state
        tasks_from: load
      tags: [always]
    - name: Preflight (read-only) and install_mode gate
      ansible.builtin.import_role:
        name: preflight
      tags: [always]
    - name: "Phase preflight: guide"
      ansible.builtin.import_role:
        name: guide
      vars:
        guide_phase: preflight
        guide_items: "{{ guide_items_preflight | default([]) }}"
      tags: [always]
  tasks:
    - name: "Phase certbot"
      ansible.builtin.import_role:
        name: certbot
      vars:
        phase_name: certbot
      tags: [certbot]
      when: install_mode in tagcess_phase_modes['certbot']
    - name: "Phase certbot: guide"
      ansible.builtin.import_role:
        name: guide
      vars:
        guide_phase: certbot
        guide_items: "{{ guide_items_certbot | default([]) }}"
      tags: [certbot]
      when: install_mode in tagcess_phase_modes['certbot']
    - name: "Phase certbot: state"
      ansible.builtin.import_role:
        name: state
        tasks_from: record
      vars:
        state_phase: certbot
      tags: [certbot]
      when: install_mode in tagcess_phase_modes['certbot']
    - name: "Phase headscale_install"
      ansible.builtin.import_role:
        name: headscale_install
