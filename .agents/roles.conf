# tagcess model roles: the default profile for each job. One file, read by the coordinator (coordinator skill).
# Profiles resolve from .agents/coord/profiles.conf merged with the developer-local ~/.config/tagcess/profiles.conf
# (list them with `scripts/coord/coord.sh profiles`).
#
# Override for one issue, highest priority first:
#   1. The developer tells the coordinator ("issue 42 with opus, review with codex").
#   2. An issue label:          model:<profile>   reviewer:<profile>
#   3. A line in the issue body: "Model: <profile>"  "Reviewer: <profile>"  (the task form's optional fields)
#   4. This file.
# The developer can change any default by editing this file in a PR.
#
# Strength order used for escalation and review: opus > codex > sonnet > deepseek.
# Fable is not used for writing, fixing or reviewing.
#
# Columns, separated by '|': key | profile | when

# --- writers (role `task` sessions; they run the `issue` skill) ---
writer          | deepseek | default: simple and medium issues, UI, tests, store/schema/query work, docs fixes
writer-auth     | sonnet   | risk:auth issues, security logic, e2e tests, cross-package changes, unclear design
fix             | sonnet   | review findings on an open PR (same branch)
escalate        | sonnet   | a writer failed twice on the same issue; a sonnet writer escalates to the developer
research        | opus     | external facts (researcher agent), ADR proposals
decision        | opus     | technical questions for a recommendation; the developer still decides

# --- reviewers (role `review` sessions; they run the `review` skill) ---
# The reviewer is a different model from the writer, at the same level or above.
review:deepseek | sonnet   | PRs written by deepseek (or another cheap OpenCode model)
review:sonnet   | codex    | PRs written by sonnet
review:opus     | codex    | PRs written by opus
review:codex    | opus     | PRs written by codex
review:*        | opus     | any other writer, and very important or hard reviews
# Re-review after a fix round: pick review:<fix profile>, never the model that wrote the fix.
review-docs     | opus     | docs/ADR/spec PRs (plan-reviewer)
