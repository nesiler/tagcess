# agent-kit configuration (key=value). Standard: ~/.claude/skills/agent-kit/reference/contract.md
# Work items are GitHub issues (gh); docs/ holds specs and decisions. Process: docs/development.md.
kit_version=1.0.0
level=2
task_source=github
task_dir=docs
check_cmd=make check
docs_lang=en
backend=auto
profiles_file=.agents/coord/profiles.conf
protocol_file=.agents/coord/protocol.md
workflow_file=.agents/skills/coordinator/SKILL.md
roles_file=.agents/roles.conf
tell_cmd=scripts/coord/tell.sh
default_reviewer=opus
