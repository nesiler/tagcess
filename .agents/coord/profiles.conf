# tagcess child-session profiles (repo part). Read by scripts/agent-kit/ak through scripts/coord/coord.sh.
#
# Profiles describe how an agent is launched on one machine (install dirs, proxy, model names), so the real ones
# do not live in the repo:
#   1. ~/.config/tagcess/profiles.conf     tagcess-local overrides ($TAGCESS_PROFILES_LOCAL); wins
#   2. this file                           the test profile only
#   3. ~/.config/agent-kit/profiles.conf   the agent-kit machine library
# `scripts/coord/coord.sh profiles` shows the merged result. Every profile named in .agents/roles.conf must exist.
#
# Columns, separated by '|': name | kind | model | args | env | equiv | use
#   kind:  claude | codex | opencode | antigravity | shell | fake
#   model: '-' means the tool's default.
#   env:   KEY=VALUE pairs exported for the child ($HOME expands).
#   equiv: agent-kit's independent-reviewer default. tagcess's reviewer rule is .agents/roles.conf and wins.
fake | fake | - | - | - | - | scripts/coord/test.sh only
